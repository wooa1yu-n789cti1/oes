name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: '17 19 * * *'

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  change-plan:
    name: Change Plan
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      phase: ${{ steps.plan.outputs.phase }}
      confirmation-required: ${{ steps.plan.outputs.confirmation-required }}
      unit: ${{ steps.plan.outputs.unit }}
      component: ${{ steps.plan.outputs.component }}
      contract: ${{ steps.plan.outputs.contract }}
      integration: ${{ steps.plan.outputs.integration }}
      journey: ${{ steps.plan.outputs.journey }}
      needs-web-install: ${{ steps.plan.outputs.needs-web-install }}
      needs-pda-install: ${{ steps.plan.outputs.needs-pda-install }}
      plan-identity: ${{ steps.plan.outputs.plan-identity }}
    steps:
      - name: Checkout complete candidate history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read last reusable scheduled FULL evidence
        if: ${{ github.event_name == 'schedule' }}
        id: schedule
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/test-infrastructure/src/schedule-state.mjs
      - name: Bind exact base, head, and FULL confirmation
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          base="${EVENT_BASE_SHA}"
          head="${EVENT_HEAD_SHA}"
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" && -n "${{ steps.schedule.outputs.last-full-sha }}" ]]; then
            base="${{ steps.schedule.outputs.last-full-sha }}"
          fi
          if [[ ! "${base}" =~ ^[0-9a-f]{40}$ ]] || [[ "${base}" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if [[ ! "${head}" =~ ^[0-9a-f]{40}$ ]]; then
            head="$(git rev-parse HEAD)"
          fi
          approved=false
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            token="ci-full-approved-${head:0:12}"
            pull="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${EVENT_PR_NUMBER}")"
            if jq --exit-status --arg token "${token}" '.labels | any(.name == $token)' <<<"${pull}" >/dev/null; then
              approved=true
            fi
          fi
          printf 'OES_CI_BASE_SHA=%s\n' "${base}" >> "${GITHUB_ENV}"
          printf 'OES_CI_HEAD_SHA=%s\n' "${head}" >> "${GITHUB_ENV}"
          printf 'OES_FULL_APPROVED=%s\n' "${approved}" >> "${GITHUB_ENV}"
      - name: Generate deterministic affected-test plan
        id: plan
        env:
          OES_LAST_FULL_SHA: ${{ steps.schedule.outputs.last-full-sha }}
          OES_LAST_FULL_AT: ${{ steps.schedule.outputs.last-full-at }}
        run: >-
          node scripts/test-infrastructure/src/change-plan.mjs
          --event "${GITHUB_EVENT_NAME}"
          --output .tmp/change-plan.json
          --github-output "${GITHUB_OUTPUT}"
      - name: Upload immutable Change Plan
        uses: actions/upload-artifact@v7
        with:
          name: change-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/change-plan.json
          if-no-files-found: error
          retention-days: 14

  full-confirmation:
    name: FULL Confirmation
    if: ${{ always() }}
    needs: [change-plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        if: ${{ needs.change-plan.result == 'success' }}
        with:
          name: change-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp
      - name: Enforce exact-head confirmation before expensive FULL
        env:
          CONFIRMATION_REQUIRED: ${{ needs.change-plan.outputs.confirmation-required }}
        run: |
          test "${{ needs.change-plan.result }}" = "success"
          if [[ "${CONFIRMATION_REQUIRED}" == "true" ]]; then
            node -e 'const fs=require("fs"); const p=require("./.tmp/change-plan.json"); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## FULL confirmation required\n\n- Trigger: ${p.reasons.join("; ")}\n- Scope: ${p.discoveryCount} tests across ${p.owners.length} owners\n- Cost: ${p.estimatedCost}\n- Exact-head confirmation: apply label \`${p.fullApprovalToken}\` and rerun CI.\n`)'
            exit 1
          fi
          echo 'FULL_CONFIRMATION=PASS'

  static:
    name: Static
    if: ${{ needs.change-plan.result == 'success' && ((needs.change-plan.outputs.phase == 'candidate' && needs.change-plan.outputs.confirmation-required != 'true') || needs.change-plan.outputs.mode == 'DOCS') }}
    needs: [change-plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: bufbuild/buf-action@v1
        if: ${{ needs.change-plan.outputs.mode != 'DOCS' }}
        with:
          setup_only: true
          github_token: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: change-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp
      - if: ${{ needs.change-plan.outputs.needs-web-install == 'true' }}
        run: pnpm --dir app/web install --frozen-lockfile
      - if: ${{ needs.change-plan.outputs.needs-pda-install == 'true' }}
        run: pnpm --dir app/pda install --frozen-lockfile
      - name: Run taxonomy, source rules, and changed-document links
        run: pnpm check:static -- --plan .tmp/change-plan.json
      - name: Run selected package static and type checks
        if: ${{ needs.change-plan.outputs.mode != 'DOCS' }}
        run: |
          pnpm generated:all
          pnpm common:build
          pnpm --filter @oes/site-runtime-kit build
          node scripts/test-infrastructure/src/package-scripts.mjs --kind static --plan .tmp/change-plan.json

  build:
    name: Build
    if: ${{ needs.change-plan.result == 'success' && needs.change-plan.outputs.phase == 'candidate' && needs.change-plan.outputs.mode != 'DOCS' && needs.change-plan.outputs.confirmation-required != 'true' }}
    needs: [change-plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: change-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp
      - if: ${{ needs.change-plan.outputs.needs-web-install == 'true' }}
        run: pnpm --dir app/web install --frozen-lockfile
      - if: ${{ needs.change-plan.outputs.needs-pda-install == 'true' }}
        run: pnpm --dir app/pda install --frozen-lockfile
      - run: pnpm generated:all
      - run: pnpm workspace:check
      - run: node scripts/test-infrastructure/src/package-scripts.mjs --kind build --plan .tmp/change-plan.json

  unit:
    name: Unit
    if: ${{ needs.change-plan.result == 'success' && needs.change-plan.outputs.phase == 'candidate' && needs.change-plan.outputs.unit == 'true' && needs.change-plan.outputs.confirmation-required != 'true' }}
    needs: [change-plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}
      - name: Install media validation runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: change-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp
      - if: ${{ needs.change-plan.outputs.needs-web-install == 'true' }}
        run: pnpm --dir app/web install --frozen-lockfile
      - if: ${{ needs.change-plan.outputs.needs-pda-install == 'true' }}
        run: pnpm --dir app/pda install --frozen-lockfile
      - run: pnpm generated:all
      - name: Build compiled Unit-test dependencies
        run: |
          pnpm common:build
          pnpm --filter notification-service build
      - run: pnpm test:run -- --type unit --plan .tmp/change-plan.json

  component:
    name: Component
    if: ${{ needs.change-plan.result == 'success' && needs.change-plan.outputs.phase == 'candidate' && needs.change-plan.outputs.component == 'true' && needs.change-plan.outputs.confirmation-required != 'true' }}
    needs: [change-plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: change-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp
      - if: ${{ needs.change-plan.outputs.needs-web-install == 'true' }}
        run: pnpm --dir app/web install --frozen-lockfile
      - if: ${{ needs.change-plan.outputs.needs-pda-install == 'true' }}
        run: pnpm --dir app/pda install --frozen-lockfile
      - run: pnpm generated:all
      - name: Build compiled Component-test dependencies
        run: pnpm common:build
      - run: pnpm test:run -- --type component --plan .tmp/change-plan.json

  contract:
    name: Contract
    if: ${{ needs.change-plan.result == 'success' && needs.change-plan.outputs.phase == 'candidate' && needs.change-plan.outputs.contract == 'true' && needs.change-plan.outputs.confirmation-required != 'true' }}
    needs: [change-plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: change-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp
      - if: ${{ needs.change-plan.outputs.needs-web-install == 'true' }}
        run: pnpm --dir app/web install --frozen-lockfile
      - if: ${{ needs.change-plan.outputs.needs-pda-install == 'true' }}
        run: pnpm --dir app/pda install --frozen-lockfile
      - run: pnpm generated:all
      - name: Build compiled Contract-test dependencies
        run: |
          pnpm common:build
          pnpm --filter @oes/site-runtime-kit build
      - run: pnpm test:run -- --type contract --plan .tmp/change-plan.json

  integration:
    name: Integration
    if: ${{ needs.change-plan.result == 'success' && needs.change-plan.outputs.phase == 'candidate' && needs.change-plan.outputs.integration == 'true' && needs.change-plan.outputs.confirmation-required != 'true' }}
    needs: [change-plan]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
    env:
      OES_CI_TASK_KEY: ci_${{ github.run_id }}_${{ github.run_attempt }}_integration
      OES_RUNTIME_CONCURRENCY: 2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: change-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp
      - name: Build compiled Integration-test dependencies
        run: |
          pnpm generated:all
          pnpm common:build
          pnpm --filter api-gateway build
          pnpm --filter @oes/site-runtime-kit build
      - run: pnpm test:run -- --type integration --plan .tmp/change-plan.json
      - name: Prove task-owned runtime cleanup
        if: ${{ always() }}
        run: |
          test -z "$(docker ps -aq --filter "label=oes.runtime.task-key=${OES_CI_TASK_KEY}")"
          test -z "$(docker volume ls -q --filter "label=oes.runtime.task-key=${OES_CI_TASK_KEY}")"
          test -z "$(docker network ls -q --filter "label=oes.runtime.task-key=${OES_CI_TASK_KEY}")"

  journey:
    name: Journey
    if: ${{ needs.change-plan.result == 'success' && needs.change-plan.outputs.phase == 'candidate' && needs.change-plan.outputs.journey == 'true' && needs.change-plan.outputs.confirmation-required != 'true' }}
    needs: [change-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - name: Install headless Journey browser
        run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: change-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp
      - if: ${{ needs.change-plan.outputs.needs-web-install == 'true' }}
        run: pnpm --dir app/web install --frozen-lockfile
      - if: ${{ needs.change-plan.outputs.needs-pda-install == 'true' }}
        run: pnpm --dir app/pda install --frozen-lockfile
      - run: pnpm generated:all
      - name: Build compiled Journey-test dependencies
        run: |
          pnpm common:build
          pnpm --filter api-gateway build
          pnpm --filter @oes/site-runtime-kit build
      - run: pnpm test:run -- --type journey --plan .tmp/change-plan.json

  quick-smoke:
    name: Main Quick Smoke
    if: ${{ needs.change-plan.result == 'success' && needs.change-plan.outputs.phase == 'quick-smoke' }}
    needs: [change-plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - name: Install headless quick-smoke browser
        run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: change-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp
      - if: ${{ needs.change-plan.outputs.needs-web-install == 'true' }}
        run: pnpm --dir app/web install --frozen-lockfile
      - if: ${{ needs.change-plan.outputs.needs-pda-install == 'true' }}
        run: pnpm --dir app/pda install --frozen-lockfile
      - run: pnpm generated:all
      - name: Build compiled Quick Smoke dependencies
        run: |
          pnpm common:build
          pnpm --filter @oes/site-runtime-kit build
      - run: |
          pnpm check:static -- --plan .tmp/change-plan.json
          pnpm test:run -- --type contract --plan .tmp/change-plan.json
          pnpm test:run -- --type journey --plan .tmp/change-plan.json

  baseline:
    name: Baseline Checks
    if: ${{ always() }}
    needs:
      [
        change-plan,
        full-confirmation,
        static,
        build,
        unit,
        component,
        contract,
        integration,
        journey,
        quick-smoke
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: ${{ needs.change-plan.result == 'success' }}
        with:
          name: change-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp
      - name: Aggregate complete fail-closed gate
        env:
          OES_JOB_RESULTS: >-
            {"changePlan":"${{ needs.change-plan.result }}","confirmation":"${{ needs.full-confirmation.result }}","static":"${{ needs.static.result }}","build":"${{ needs.build.result }}","unit":"${{ needs.unit.result }}","component":"${{ needs.component.result }}","contract":"${{ needs.contract.result }}","integration":"${{ needs.integration.result }}","journey":"${{ needs.journey.result }}","quick":"${{ needs.quick-smoke.result }}"}
        run: node scripts/test-infrastructure/src/gate.mjs .tmp/change-plan.json
      - name: Seal successful scheduled FULL evidence
        if: ${{ github.event_name == 'schedule' && needs.change-plan.outputs.mode == 'FULL' }}
        run: cp .tmp/change-plan.json .tmp/full-evidence.json
      - name: Upload reusable scheduled FULL evidence
        if: ${{ github.event_name == 'schedule' && needs.change-plan.outputs.mode == 'FULL' }}
        uses: actions/upload-artifact@v7
        with:
          name: full-evidence-${{ github.sha }}
          path: .tmp/full-evidence.json
          if-no-files-found: error
          retention-days: 30
