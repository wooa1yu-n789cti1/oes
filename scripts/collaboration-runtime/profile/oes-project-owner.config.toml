approval_policy = "{{APPROVAL_POLICY}}"
approvals_reviewer = "{{APPROVALS_REVIEWER}}"
default_permissions = "oes-project-owner"

[shell_environment_policy.set]
NPM_CONFIG_SHELL_EMULATOR = "true"
TMPDIR = "{{TASK_TEMP_PATH}}"

[collaboration_runtime]
project_key = "{{PROJECT_KEY}}"
owner_task_id = "{{OWNER_TASK_ID}}"
transition_id = "{{TRANSITION_ID}}"
approval_mode = "{{APPROVAL_MODE}}"
expected_effective_permission_sandbox_fingerprint = "{{EXPECTED_EFFECTIVE_PERMISSION_SANDBOX_FINGERPRINT}}"
trusted_authorization_root = "{{TRUSTED_AUTHORIZATION_ROOT}}"
serial_admission_root = "{{SERIAL_ADMISSION_ROOT}}"
resource_topology_version = "{{RESOURCE_TOPOLOGY_VERSION}}"
owner_resource_binding_path = "{{OWNER_RESOURCE_BINDING_PATH}}"
owner_resource_binding_sha256 = "{{OWNER_RESOURCE_BINDING_SHA256}}"
owner_resource_binding_fingerprint = "{{OWNER_RESOURCE_BINDING_FINGERPRINT}}"

[features]
network_proxy = true

[permissions.oes-project-owner]
description = "Rendered per OES owner; placeholders are replaced before fingerprinting and handoff"

[permissions.oes-project-owner.workspace_roots]
"{{OWNER_PATH}}" = true
"{{ARTIFACT_PATH}}" = true
"{{TASK_TEMP_PATH}}" = true

[permissions.oes-project-owner.filesystem]
":minimal" = "read"
"{{REPOSITORY_ROOT}}" = "read"
"{{OWNER_GIT_DIRECTORY}}" = "write"
"{{USER_GIT_CONFIG}}" = "read"
"{{CREDENTIAL_STORE_PATH}}" = "read"
"{{TRUSTED_AUTHORIZATION_ROOT}}" = "read"
"{{SERIAL_ADMISSION_ROOT}}" = "write"
"{{PACKAGE_CACHE_PATH}}" = "write"
"/Library/Developer/CommandLineTools" = "read"
"/System/Library/OpenSSL" = "read"
"/usr/local/bin/node" = "read"
"/opt/homebrew/bin/buf" = "read"

[permissions.oes-project-owner.filesystem.":workspace_roots"]
"." = "write"
"**/*.env" = "deny"
"**/.env" = "deny"
"**/*.key" = "deny"
"**/*private-key*" = "deny"

[permissions.oes-project-owner.network]
enabled = true
allow_local_binding = true
allow_upstream_proxy = true

[permissions.oes-project-owner.network.domains]
"github.com" = "allow"
"api.github.com" = "allow"
"objects.githubusercontent.com" = "allow"
"raw.githubusercontent.com" = "allow"
"registry.npmjs.org" = "allow"
"localhost" = "allow"
"127.0.0.1" = "allow"
